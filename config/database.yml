default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary: &primary_development
    <<: *default
    database: demo_ecom_api_development
  # Solid Queue's tables live in the same physical database as `primary`
  # (DECISION-003/016) — this role only exists so its schema can be loaded
  # separately via db/queue_schema.rb, matching production's structure.
  queue:
    <<: *primary_development
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: demo_ecom_api_test

production:
  primary: &primary_production
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *primary_production
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    migrations_paths: db/queue_migrate
